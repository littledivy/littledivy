<svg xmlns="http://www.w3.org/2000/svg" width="930" height="300" viewBox="0 0 930 300">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5f6b7a" /></marker></defs>
  <rect width="100%" height="100%" fill="white"/>
