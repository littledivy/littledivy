<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">Clawpatrol blocking a dangerous Claude action</title>
  <desc id="desc">A Claude Code terminal window where a database command is blocked before any credential is injected.</desc>

  <rect x="0" y="0" width="820" height="390" fill="#ffffff"/>

  <path d="M46 34 H774 V374 H36 V44 Q36 34 46 34 Z" fill="#000000" opacity="0.10"/>
  <path d="M38 24 H782 Q792 24 792 34 V366 H28 V34 Q28 24 38 24 Z" fill="#c9c7c0"/>
  <path d="M38 25 H782 Q791 25 791 34 V365 H29 V34 Q29 25 38 25 Z" fill="#111111"/>
  <rect x="29" y="25" width="762" height="33" rx="9" fill="#e8e6df"/>
  <rect x="29" y="44" width="762" height="14" fill="#e8e6df"/>
  <line x1="29" y1="58" x2="791" y2="58" stroke="#b8b6af"/>
  <rect x="29" y="59" width="762" height="305" fill="#111111"/>

  <g>
    <circle cx="49" cy="41" r="5.2" fill="#ff5f57" stroke="#d4473f" stroke-width=".8"/>
    <circle cx="68" cy="41" r="5.2" fill="#febc2e" stroke="#d49a21" stroke-width=".8"/>
    <circle cx="87" cy="41" r="5.2" fill="#28c840" stroke="#1f9f32" stroke-width=".8"/>
    <text x="410" y="45" fill="#4a4945" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">clawpatrol run claude</text>

    <g font-family="Iosevka, SFMono-Regular, Menlo, Consolas, ui-monospace, monospace" font-size="14">
      <text x="50" y="91" fill="#8bd49c">divy@agent</text>
      <text x="137" y="91" fill="#777777">:</text>
      <text x="148" y="91" fill="#8ab4f8">~/work</text>
      <text x="207" y="91" fill="#777777">$</text>
      <text x="224" y="91" fill="#e9e6dc">clawpatrol run claude</text>
      <text x="50" y="135" fill="#e9e6dc">&gt; clean up the stale test database</text>
      <text x="50" y="178" fill="#c7c7c7">⏺ I'll remove the stale test data. First I'll run the cleanup query.</text>
      <text x="50" y="222" fill="#ffb86c">⏺ Bash(psql $DATABASE_URL -c 'DROP TABLE users;')</text>
      <text x="73" y="254" fill="#ff6b5f" font-weight="700">⎿  clawpatrol: blocked</text>
      <text x="98" y="286" fill="#c7c7c7">deny rule matched: destructive sql; drop users table not allowed</text>
      <text x="50" y="345" fill="#777777">&gt;</text>
      <text x="70" y="345" fill="#e9e6dc">_</text>
    </g>
  </g>
</svg>
