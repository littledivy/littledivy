<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">Clawpatrol blocking a dangerous Claude action</title>
  <desc id="desc">A Claude Code terminal window where a database command is blocked before any credential is injected.</desc>

  <rect x="0" y="0" width="820" height="390" fill="#ffffff"/>

  <rect x="36" y="34" width="748" height="340" rx="10" fill="#000000" opacity="0.10"/>
  <rect x="28" y="24" width="764" height="342" rx="10" fill="#111111"/>
  <rect x="28" y="24" width="764" height="34" rx="10" fill="#e8e6df"/>
  <rect x="28" y="44" width="764" height="14" fill="#e8e6df"/>
  <line x1="28" y1="58" x2="792" y2="58" stroke="#b8b6af"/>
  <rect x="28" y="58" width="764" height="308" fill="#111111"/>
  <rect x="28.5" y="24.5" width="763" height="341" rx="9.5" fill="none" stroke="#c9c7c0"/>

  <g>
    <circle cx="49" cy="41" r="5.2" fill="#ff5f57" stroke="#d4473f" stroke-width=".8"/>
    <circle cx="68" cy="41" r="5.2" fill="#febc2e" stroke="#d49a21" stroke-width=".8"/>
    <circle cx="87" cy="41" r="5.2" fill="#28c840" stroke="#1f9f32" stroke-width=".8"/>
    <text x="410" y="45" fill="#4a4945" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">clawpatrol run claude</text>

    <g font-family="Iosevka, SFMono-Regular, Menlo, Consolas, ui-monospace, monospace" font-size="14">
      <text x="50" y="91" fill="#8bd49c">divy@agent</text>
      <text x="137" y="91" fill="#777777">:</text>
      <text x="148" y="91" fill="#8ab4f8">~/work</text>
      <text x="207" y="91" fill="#777777">$</text>
      <text x="224" y="91" fill="#e9e6dc">clawpatrol run claude</text>
      <rect x="50" y="106" width="704" height="146" rx="6" fill="none" stroke="#c7c7c7" stroke-width="1"/>
      <rect x="72" y="99" width="146" height="14" fill="#111111"/>
      <text x="78" y="111" fill="#c7c7c7" font-size="12">Claude Code v2.1.144</text>
      <line x1="512" y1="106" x2="512" y2="252" stroke="#c7c7c7" stroke-width="1"/>
      <text x="548" y="130" fill="#c7c7c7" font-size="13">Tips for getting started</text>
      <text x="548" y="153" fill="#c7c7c7" font-size="13">Run /init to create CLAUDE.md</text>
      <line x1="530" y1="171" x2="736" y2="171" stroke="#555555" stroke-width="1"/>
      <text x="548" y="194" fill="#c7c7c7" font-size="13">What's new</text>
      <text x="548" y="217" fill="#777777" font-size="13">/release-notes for more</text>
      <text x="232" y="139" fill="#e9e6dc" font-size="15">Welcome back!</text>
      <text x="225" y="173" fill="#d97757" font-size="21" font-weight="700">▐▛███▜▌</text>
      <text x="198" y="196" fill="#d97757" font-size="21" font-weight="700">▝▜█████▛▘</text>
      <text x="242" y="218" fill="#d97757" font-size="21" font-weight="700">▘▘ ▝▝</text>
      <text x="86" y="226" fill="#777777" font-size="12">Opus 4.7 (1M context) · API Usage Billing</text>
      <text x="126" y="244" fill="#777777" font-size="12">~/.openclaw/workspace/repos/littledivy</text>
      <text x="50" y="282" fill="#e9e6dc">&gt; clean up the stale test database</text>
      <text x="50" y="308" fill="#c7c7c7">⏺ I'll run the cleanup query.</text>
      <text x="50" y="334" fill="#ffb86c">⏺ Bash(psql $DATABASE_URL -c 'DROP TABLE users;')</text>
      <text x="415" y="334" fill="#ff6b5f" font-weight="700">⎿ clawpatrol: blocked</text>
    </g>
  </g>
</svg>
