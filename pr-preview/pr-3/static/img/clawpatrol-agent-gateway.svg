<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">Clawpatrol blocking a dangerous Claude action</title>
  <desc id="desc">A quiet terminal-style illustration where Claude attempts DROP TABLE users and Clawpatrol blocks the request before any credential is injected.</desc>

  <rect x="0" y="0" width="820" height="390" fill="#ffffff"/>
  <rect x="1" y="1" width="818" height="388" rx="2" fill="none" stroke="#d0d0d0"/>

  <rect x="48" y="42" width="724" height="270" rx="5" fill="#fbfaf7" stroke="#333333" stroke-width="1.2"/>
  <rect x="48" y="42" width="724" height="34" rx="5" fill="#f1f1ee" stroke="#333333" stroke-width="1.2"/>
  <line x1="48" y1="76" x2="772" y2="76" stroke="#333333" stroke-width="1.2"/>
  <circle cx="69" cy="59" r="4.5" fill="#c44d32"/>
  <circle cx="86" cy="59" r="4.5" fill="#d0d0d0"/>
  <circle cx="103" cy="59" r="4.5" fill="#d0d0d0"/>
  <text x="129" y="64" fill="#666666" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="12">clawpatrol run -- claude</text>

  <text x="80" y="116" fill="#666666" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="13">$ claude</text>
  <text x="80" y="148" fill="#333333" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="13">Claude &gt; cleaning up the stale test database...</text>

  <rect x="80" y="174" width="660" height="54" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="104" y="207" fill="#333333" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="15">SQL: DROP TABLE users;</text>

  <rect x="80" y="254" width="660" height="34" rx="3" fill="#ffffff" stroke="#c44d32" stroke-width="1.2"/>
  <text x="104" y="276" fill="#c44d32" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="13" font-weight="700">clawpatrol: blocked</text>
  <text x="271" y="276" fill="#666666" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="12">deny rule matched: destructive sql</text>
  <text x="548" y="276" fill="#666666" font-family="Iosevka, Fira Mono, ui-monospace, monospace" font-size="12">no credential injected</text>

  <text x="74" y="352" fill="#666666" font-family="gitan, Alegreya, Palatino, Georgia, serif" font-size="15" font-style="italic">The agent keeps its normal tools. Clawpatrol keeps the credential boundary.</text>
</svg>
