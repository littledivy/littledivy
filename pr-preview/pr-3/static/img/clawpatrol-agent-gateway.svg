<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Clawpatrol personal agent network path</title>
  <desc id="desc">A personal agent runs under clawpatrol, enters a per-process namespace, uses Clawpatrol WireGuard over Tailscale to reach a gateway, then the gateway injects credentials, applies policy rules, and forwards approved requests to Claude, GitHub, and Slack.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .label { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .code { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #374151; }
      .zone-title { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
      .box { stroke-width: 1.5; rx: 14; }
      .connector { fill: none; stroke: #4b5563; stroke-width: 2.5; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #9ca3af; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect x="20" y="24" width="1080" height="592" rx="28" fill="#f8fafc" stroke="#e5e7eb"/>

  <rect x="52" y="68" width="308" height="504" rx="22" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="76" y="104" class="zone-title">AGENT MACHINE</text>

  <rect x="76" y="136" width="260" height="96" class="box" fill="#ffffff" stroke="#818cf8"/>
  <text x="104" y="172" class="label">Claude CLI</text>
  <text x="104" y="200" class="code">clawpatrol run -- claude</text>

  <rect x="76" y="280" width="260" height="116" class="box" fill="#ffffff" stroke="#818cf8"/>
  <text x="104" y="318" class="label">Per-process netns</text>
  <text x="104" y="346" class="small">only the agent process</text>
  <text x="104" y="370" class="small">tree is routed</text>

  <rect x="92" y="428" width="228" height="92" class="box" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="122" y="464" class="label">Local join state</text>
  <text x="122" y="492" class="small">CA + placeholder env</text>

  <rect x="408" y="68" width="286" height="504" rx="22" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="432" y="104" class="zone-title">TRANSPORT</text>

  <rect x="444" y="150" width="214" height="98" class="box" fill="#ffffff" stroke="#22d3ee"/>
  <text x="478" y="188" class="label">Clawpatrol WG</text>
  <text x="478" y="216" class="small">policy tunnel</text>

  <rect x="444" y="330" width="214" height="98" class="box" fill="#ffffff" stroke="#22d3ee"/>
  <text x="506" y="368" class="label">Tailscale</text>
  <text x="481" y="396" class="small">private transport mesh</text>

  <path class="connector" d="M 206 232 C 206 252 206 260 206 280"/>
  <path class="connector" d="M 336 338 C 376 338 398 206 444 206"/>
  <path class="connector-soft" d="M 552 248 C 552 286 552 296 552 330"/>

  <rect x="742" y="68" width="318" height="504" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="766" y="104" class="zone-title">CLAWPATROL GATEWAY</text>

  <rect x="770" y="136" width="262" height="98" class="box" fill="#ffffff" stroke="#34d399"/>
  <text x="812" y="174" class="label">Credential injection</text>
  <text x="812" y="202" class="small">tokens live here</text>

  <rect x="770" y="270" width="262" height="112" class="box" fill="#ffffff" stroke="#34d399"/>
  <text x="812" y="310" class="label">Rules engine</text>
  <text x="812" y="338" class="small">allow, deny, approve</text>
  <text x="812" y="362" class="small">based on parsed traffic</text>

  <rect x="770" y="420" width="262" height="96" class="box" fill="#ffffff" stroke="#34d399"/>
  <text x="812" y="458" class="label">Human approval</text>
  <text x="812" y="486" class="small">Slack buttons for writes</text>

  <path class="connector" d="M 658 206 C 704 206 724 185 770 185"/>
  <path class="connector" d="M 901 234 C 901 252 901 258 901 270"/>
  <path class="connector-soft" d="M 901 382 C 901 402 901 408 901 420"/>

  <rect x="770" y="548" width="262" height="44" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="806" y="576" class="small">audit log + connected profiles</text>

  <path class="connector" d="M 1032 184 C 1070 184 1080 146 1094 124"/>
  <path class="connector" d="M 1032 326 C 1076 326 1088 326 1100 326"/>
  <path class="connector" d="M 1032 468 C 1070 468 1080 508 1094 532"/>

  <g transform="translate(888 34)">
    <rect x="0" y="0" width="188" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="18" y="28" class="small">external services</text>
  </g>
  <g transform="translate(934 108)">
    <rect x="0" y="0" width="138" height="48" rx="14" fill="#ffffff" stroke="#fed7aa"/>
    <text x="34" y="30" class="small">Claude</text>
  </g>
  <g transform="translate(944 302)">
    <rect x="0" y="0" width="138" height="48" rx="14" fill="#ffffff" stroke="#fed7aa"/>
    <text x="34" y="30" class="small">GitHub</text>
  </g>
  <g transform="translate(944 508)">
    <rect x="0" y="0" width="138" height="48" rx="14" fill="#ffffff" stroke="#fed7aa"/>
    <text x="42" y="30" class="small">Slack</text>
  </g>

  <rect x="412" y="520" width="280" height="52" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="436" y="552" class="tiny">Tailscale carries the packet. Clawpatrol WG gives it policy identity.</text>
</svg>
